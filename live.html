<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE CLASS - PARAMI ENGLISH CLASS</title>
    
    <script src='https://meet.jit.si/external_api.js'></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root { --navy: #002347; --red: #ed1c24; --gold: #fbbf24; }
        body { margin: 0; padding: 0; background: #0f172a; font-family: 'Pyidaungsu', sans-serif; color: white; overflow: hidden; }

        .navbar { background: var(--navy); border-bottom: 3px solid var(--red); padding: 8px 0; }
        .navbar-brand img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #fff; margin-right: 12px; }
        .navbar-brand span { font-weight: 800; color: white; font-size: 1.1rem; text-transform: uppercase; }
        
        .btn-exit { background: var(--red); color: white !important; border-radius: 50px; padding: 6px 18px !important; font-weight: bold; font-size: 0.85rem; transition: 0.3s; }
        .btn-exit:hover { background: #c1161c; transform: scale(1.05); }

        .main-content { height: calc(100vh - 70px); display: flex; flex-direction: column; padding: 10px; }
        
        #meet-container { 
            flex-grow: 1; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .status-bar { 
            background: rgba(255,255,255,0.05); 
            padding: 8px; 
            text-align: center; 
            font-size: 0.8rem; 
            color: var(--gold); 
            border-radius: 0 0 12px 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="uploads/logo.jpg" alt="Logo" onerror="this.src='https://via.placeholder.com/45'">
            <span>PARAMI LIVE ROOM</span>
        </a>
        
        <div class="ms-auto d-flex align-items-center">
            <span class="d-none d-md-inline me-3 text-white-50 small">
                <i class="bi bi-record-circle text-danger me-1"></i> LIVE SESSION
            </span>
            <a href="index.html" class="btn btn-exit">
                <i class="bi bi-door-open me-1"></i> EXIT
            </a>
        </div>
    </div>
</nav>

<div class="main-content">
    <div id="meet-container"></div>
    <div class="status-bar">
        <i class="bi bi-shield-check me-1"></i> သင်တန်းခန်းမသို့ လုံခြုံစွာ ရောက်ရှိနေပါသည်။ ကျေးဇူးပြု၍ မိမိအမည်အမှန်ကို ရိုက်ထည့်၍ Join ပါ။
    </div>
</div>

<script>
    const roomName = "PARAMI_CLASS_LIVE_ROOM";
    const displayName = "Student";

    const domain = 'meet.jit.si';
    const options = {
        roomName: roomName,
        width: '100%',
        height: '100%',
        parentNode: document.querySelector('#meet-container'),
        userInfo: {
            displayName: displayName
        },
        configOverwrite: {
            startWithAudioMuted: true,
            startWithVideoMuted: false,
            enableWelcomePage: false,
            prejoinPageEnabled: true,
            disableDeepLinking: true
        },
        interfaceConfigOverwrite: {
            TOOLBAR_BUTTONS: [
                'microphone', 'camera', 'closedcaptions', 'desktop', 'fullscreen',
                'fmsort', 'hangup', 'chat', 'raisehand', 'videoquality', 
                'filmstrip', 'tileview', 'shortcuts', 'help'
            ],
            SETTINGS_SECTIONS: ['devices', 'language', 'profile', 'calendar'],
            SHOW_CHROME_EXTENSION_BANNER: false
        }
    };

    const api = new JitsiMeetExternalAPI(domain, options);

    api.addEventListener('videoConferenceLeft', () => {
        window.location.href = "index.html";
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
